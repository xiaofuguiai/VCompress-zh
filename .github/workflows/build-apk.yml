name: Build Android APK (zh)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Set up Flutter (pin 3.41.9, Dart 3.11.5 >=3.8.1 meets sdk; IconData non-final so phosphor 2.1.0 compiles; >=3.34 meets flex_color_scheme)"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Create CI signing keystore (key.properties for release signing)
        run: |
          "$JAVA_HOME/bin/keytool" -genkey -v -keystore "$RUNNER_TEMP/ci_key.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias cikey -storepass cipass -keypass cipass -dname "CN=VCompressCI"
          echo "storeFile=$RUNNER_TEMP/ci_key.jks" > android/key.properties
          echo "storePassword=cipass" >> android/key.properties
          echo "keyAlias=cikey" >> android/key.properties
          echo "keyPassword=cipass" >> android/key.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-zh
          path: build/app/outputs/flutter-apk/app-release.apk
